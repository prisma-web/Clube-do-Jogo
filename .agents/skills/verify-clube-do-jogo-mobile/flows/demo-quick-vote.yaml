appId: com.clubedojogo.mobile.dev
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: Boas-vindas de volta
    timeout: 30000
- tapOn: Entrar no modo demonstração
- extendedWaitUntil:
    visible: 'Qual jogo você quer no clube\?|Fechar e marcar como vista'
    timeout: 30000
- runFlow:
    when:
      visible: Agora não
    commands:
      - tapOn: Agora não
- extendedWaitUntil:
    visible: Qual jogo você quer no clube?
    timeout: 30000
- assertVisible: Cocoon, jogo 1 de 5
- takeScreenshot: deck-antes-do-voto
- tapOn: Votar não em Cocoon
- extendedWaitUntil:
    visible: Celeste, jogo 2 de 5
    timeout: 10000
- assertNotVisible: Votar não em Cocoon
- takeScreenshot: deck-depois-do-voto
