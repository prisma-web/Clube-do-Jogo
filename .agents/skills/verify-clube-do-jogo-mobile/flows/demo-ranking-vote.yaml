appId: com.clubedojogo.mobile.dev
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: Boas-vindas de volta
    timeout: 30000
- tapOn: Entrar no modo demonstração
- extendedWaitUntil:
    visible: 'Fechar votação rápida|Fechar e marcar como vista'
    timeout: 30000
- repeat:
    times: 2
    commands:
      - waitForAnimationToEnd
      - runFlow:
          when:
            visible: Agora não
          commands:
            - tapOn: Agora não
      - waitForAnimationToEnd
      - runFlow:
          when:
            visible: Fechar votação rápida
          commands:
            - tapOn: Fechar votação rápida
- waitForAnimationToEnd
- assertNotVisible: Fechar votação rápida
- assertNotVisible: Agora não
- tapOn:
    text: 'Ranking(, tab, 2 of 5)?'
    index: 0
- scrollUntilVisible:
    element: Ver detalhes de Cocoon
    direction: DOWN
- takeScreenshot: antes-do-voto
- tapOn:
    text: Não jogaria
    enabled: true
    below: Ver detalhes de Cocoon
    index: 0
- assertVisible: Por que você não jogaria?
- tapOn: Não consigo rodar
- tapOn: Confirmar Não
- scrollUntilVisible:
    element: 'Meu motivo: Não consigo rodar'
    direction: DOWN
- takeScreenshot: depois-do-voto
- tapOn:
    text: Não jogaria
    enabled: true
    below: Ver detalhes de Cocoon
    index: 0
- assertNotVisible: 'Meu motivo: Não consigo rodar'
- takeScreenshot: voto-removido
