name: Android release

# Uma tag vX.Y.Z vira um APK assinado no GitHub Release da tag, que o app de produção
# oferece como atualização. Configuração única em docs/mobile-release.md.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG: ${{ github.ref_name }}
      APP_VARIANT: production
      EXPO_NO_DOTENV: '1'
      EXPO_NO_TELEMETRY: '1'
      # O Gradle relê o app.config ao empacotar o JS, então estas variáveis valem para o job todo.
      EXPO_APPLICATION_ID: ${{ vars.EXPO_APPLICATION_ID }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL || secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL || secrets.EXPO_PUBLIC_API_BASE_URL }}
      EXPO_PUBLIC_SITE_URL: ${{ vars.EXPO_PUBLIC_SITE_URL || secrets.EXPO_PUBLIC_SITE_URL }}
    steps:
      - name: Check tag and release configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)$ ]]; then
            echo "::error::A tag $TAG não é vX.Y.Z com minor e patch abaixo de 100."
            exit 1
          fi
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD \
            EXPO_APPLICATION_ID EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY EXPO_PUBLIC_API_BASE_URL EXPO_PUBLIC_SITE_URL; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::error::Faltam secrets ou variables do repositório: ${missing[*]}. Veja docs/mobile-release.md."
            exit 1
          fi
          echo "APP_VERSION=${TAG#v}" >> "$GITHUB_ENV"

      # O histórico inteiro e as tags deixam o assemble achar a tag anterior e as notas adicionadas desde ela.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # O checkout traz a tag sem a anotação, e a anotação vira o texto do release no app.
      - name: Fetch the annotated tag
        run: git fetch --force --no-tags origin "+refs/tags/$TAG:refs/tags/$TAG"

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # Antes do build: uma nota inválida falha o release em segundos. Sem nota nova, o arquivo não é gerado.
      - name: Assemble the release notes
        run: node scripts/release-notes.mjs assemble "$TAG" --out "$RUNNER_TEMP/product-update.json"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - run: npm ci

      - name: Decode the release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          keystore="$RUNNER_TEMP/release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Generate the native Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build the release APK
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # O lintVital estourou o Metaspace de 512 MB do template e o JVM ficou travado até o
        # timeout do job. O APK não precisa do lintVital; o resto da memória e o timeout do step
        # fazem um OOM futuro falhar logo em vez de travar.
        timeout-minutes: 40
        run: >-
          ./gradlew assembleRelease --no-daemon -x lintVitalRelease
          "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+ExitOnOutOfMemoryError"
          -Pkotlin.daemon.jvmargs=-Xmx2g

      - name: Verify signature and version
        run: |
          apk=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          build_tools="$(printf '%s\n' "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          "$build_tools/apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/apksigner.txt"
          if grep -q 'CN=Android Debug' "$RUNNER_TEMP/apksigner.txt"; then
            echo "::error::O APK saiu assinado com a keystore de debug."
            exit 1
          fi
          # Sem pipe para head: com pipefail, o SIGPIPE do aapt2 falharia o step.
          badging="$("$build_tools/aapt2" dump badging "$apk")"
          grep -m1 '^package:' <<<"$badging"
          if [[ "$badging" != *"versionName='$APP_VERSION'"* ]]; then
            echo "::error::O APK não tem versionName $APP_VERSION."
            exit 1
          fi
          mv "$apk" "$RUNNER_TEMP/clube-do-jogo-$TAG.apk"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          assets=("$RUNNER_TEMP/clube-do-jogo-$TAG.apk")
          # O app e o site leem as novidades deste asset; o nome product-update.json é contrato.
          if [[ -f "$RUNNER_TEMP/product-update.json" ]]; then
            assets+=("$RUNNER_TEMP/product-update.json")
          fi
          # Rodar de novo o job substitui os assets em vez de falhar no release já criado.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --title "$TAG" --notes-from-tag --verify-tag
          fi
